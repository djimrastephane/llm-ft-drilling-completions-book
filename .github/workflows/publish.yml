name: Publish book to GitHub Pages

# Manual only for now: this book still has placeholder-only chapters
# (4-13) in its nav, so publishing isn't triggered by every push to main
# yet. Run this from the Actions tab (or `gh workflow run publish.yml`)
# once you're ready for the book to be publicly browsable.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # quarto-actions/publish's gh-pages target requires the branch to
      # already exist on the remote -- it doesn't create one for you (see
      # https://github.com/quarto-dev/quarto-actions/blob/main/publish/action.yml).
      # This makes that a one-time, self-healing step instead of a manual
      # `quarto publish gh-pages` a human has to remember to run first.
      - name: Ensure gh-pages branch exists
        run: |
          if ! git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout --orphan gh-pages
            git rm -rf . > /dev/null 2>&1 || true
            git commit --allow-empty -m "Initialize gh-pages branch"
            git push origin gh-pages
            git checkout main
          fi

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Chapter code cells are expected to run with eval:false once drafted,
      # same as the author's previous book -- Quarto still starts a Jupyter
      # kernel per chapter but never executes or imports anything inside it.
      # Only jupyter/ipykernel are needed for that; installing the full
      # requirements.txt (torch, transformers, peft...) here just adds
      # minutes of unnecessary install time and risk for a render that
      # never uses any of it.
      - name: Install minimal render dependencies
        run: pip install jupyter ipykernel

      - name: Register Jupyter kernel
        run: python -m ipykernel install --user --name python3

      - name: Render and publish to gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: book
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
