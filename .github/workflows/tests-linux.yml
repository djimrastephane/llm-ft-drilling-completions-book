name: Code tests Linux

on:
  push:
    branches: [main]
    paths:
      - "book/**"
  pull_request:
    paths:
      - "book/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: book
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: book/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # `slow` tests download and run the ~3GB base model -- fine locally,
      # but too slow/expensive to repeat on three OS runners on every push
      # (macOS and Windows have both hit the 20-minute job timeout running
      # them). CI checks the fast, deterministic majority of the suite;
      # slow tests are still meant to be run locally before a chapter
      # ships (see tests/test_chapter_01.py's docstring).
      - name: Run tests
        run: pytest -v -m "not slow"
